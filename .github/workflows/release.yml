name: Release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run check
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e "const m=require('./manifest.json'); if (m.version !== process.env.RELEASE_TAG) { console.error('Tag must equal manifest version'); process.exit(1); }"
      - name: Attest release assets
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            styles.css
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css --title "$GITHUB_REF_NAME" --generate-notes
